// 应用标准 Android Library 插件
apply plugin: 'com.android.library'

// 引入 JitPack 构建脚本（用于发布）
apply from: 'jitpack.gradle'

// Kotlin Android 支持（如果使用了 Kotlin）
apply plugin: 'org.jetbrains.kotlin.android'

// 启用 Maven 发布插件（用于本地或远程发布 AAR）
apply plugin: 'maven-publish'

android {
    namespace 'com.tbruyelle.rxpermissions3' // 推荐添加命名空间
    compileSdkVersion rootProject.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    testOptions.unitTests.includeAndroidResources = true
    testOptions.unitTests.all {
        testLogging {
            events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        }
    }
}

dependencies {
    implementation rootProject.ext.rxJava
    implementation rootProject.ext.androidXFragment
    implementation rootProject.ext.androidXAnnotation
    implementation rootProject.ext.androidXAppcompat

    testImplementation rootProject.ext.junit
    testImplementation rootProject.ext.mockito
    testImplementation rootProject.ext.robolectric
    testImplementation rootProject.ext.khronosOpenGLApi
}
